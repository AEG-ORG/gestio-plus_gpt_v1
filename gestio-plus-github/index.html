<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestio+ · Votre activité, simplement</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#192339;font:14px system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #dde0eb;border-radius:8px;background:white;padding:10px 14px;color:inherit}button:hover{background:#eef0ff}button.primary{background:#6553dc;color:white;border-color:#6553dc}aside{position:fixed;inset:0 auto 0 0;width:205px;background:#142138;color:#b9c4d7;padding:30px 20px}.brand{color:white;font-size:27px;font-weight:800;letter-spacing:-1px}.brand span{color:#a598ff}aside small{display:block;margin:8px 0 38px}nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#b9c4d7;margin:8px 0}nav button.active{background:#2d3859;color:white}aside footer{position:absolute;bottom:25px;font-size:11px;line-height:1.8}main{margin-left:205px;padding:27px 30px;max-width:1800px}h1{font-size:27px;margin:7px 0}h2{font-size:17px;margin:0 0 18px}h3{font-size:13px}.muted{color:#7a8395}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.pill{background:#eae6ff;color:#6553dc;padding:7px 10px;border-radius:20px;font-size:11px}.grid{display:grid;grid-template-columns:minmax(390px, .95fr) minmax(410px,1.05fr);gap:25px;align-items:start}.card{background:white;border:1px solid #e5e7ef;border-radius:13px;padding:23px;margin-bottom:17px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:12px;color:#647087;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #dfe3ed;border-radius:7px;background:white;color:#192339}textarea{resize:vertical}.field{margin-bottom:13px}.row{display:flex;gap:9px;align-items:center}.row>*{min-width:0}.line{padding:14px 0;border-bottom:1px solid #edf0f5}.line .fields{grid-template-columns:1fr 1fr 1fr;margin-top:9px;gap:8px}.line .row input{flex:1}.tiny{padding:7px 10px;font-size:11px}.savecat{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11px}.savecat input{width:auto}.previewwrap{position:sticky;top:20px}.paper{background:white;padding:34px;min-height:660px;box-shadow:0 7px 30px #26385a12;border-radius:3px;font-size:11px}.paperhead{border-top:7px solid var(--accent,#6553dc);padding-top:22px;display:flex;justify-content:space-between;gap:15px}.paper h2{font-size:25px;margin-bottom:6px;color:var(--accent,#6553dc)}.paper h3{margin:0 0 8px;font-size:17px}.paper .parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:30px 0;line-height:1.8;white-space:pre-line}.paper table{width:100%;border-collapse:collapse;font-size:10px}.paper th{background:#f3f4f8;text-align:left;padding:10px 5px}.paper td{padding:12px 5px;border-bottom:1px solid #eee;vertical-align:top}.paper td:not(:first-child),.paper th:not(:first-child){text-align:right}.totals{width:65%;margin:24px 0 20px auto}.sum{display:flex;justify-content:space-between;padding:7px 0;gap:10px}.grand{background:var(--accent,#6553dc);color:white;font-size:16px;padding:13px;margin-top:8px}.note{font-size:10px;line-height:1.7;color:#758096;border-top:1px solid #e6e8ed;padding-top:15px;margin-top:25px}.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.stat b{display:block;font-size:27px;margin:12px 0}.listrow{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #eee;gap:12px}.toast{position:fixed;bottom:25px;right:25px;background:#142138;color:white;padding:15px 22px;border-radius:9px;z-index:10}.tag{font-size:10px;background:#f1edf9;padding:5px 9px;border-radius:15px}a{color:#6553dc}#view>p{line-height:1.7}.mobilebrand{display:none}button:focus-visible,input:focus-visible{outline:3px solid #ad9aff}.helper{font-size:11px;color:#7a8395;line-height:1.6;margin:10px 0 0}.paper.minimal .paperhead{border-top:1px solid #222}.paper.atelier .paperhead{border-top-width:15px}
@media(max-width:1100px){.grid{grid-template-columns:1fr}.previewwrap{position:static}.paper{max-width:720px;margin:auto}}@media(max-width:650px){aside{position:static;width:auto;padding:15px}aside small,aside footer{display:none}nav{display:flex;overflow:auto}nav button{width:auto;white-space:nowrap;margin:8px 2px}.brand{font-size:22px}main{margin:0;padding:18px 12px}.grid{display:block}.card{padding:16px}.top{align-items:start}.top .pill{display:none}.stats{grid-template-columns:1fr}.paper{padding:19px}.fields{gap:10px}.paper table{font-size:9px}}
@media print{body{background:white}aside,.top,#editor,.previewbar,.helper,.toast{display:none!important}main{margin:0;padding:0}.grid{display:block}.previewwrap{position:static}.paper{box-shadow:none;border:0;padding:10mm;min-height:0;font-size:10pt}.paper table{font-size:9pt}.paper tr{break-inside:avoid}.paper .note{font-size:8pt}@page{size:A4;margin:10mm}}
</style><aside><div class="brand">gestio<span>+</span></div><small>Votre activité, simplement.</small><nav id="nav"></nav><footer>PROTOTYPE INTERACTIF<br>Saisie clavier · Sans IA<br>Données dans ce navigateur</footer></aside><main><div class="top"><div><div class="muted" id="crumb">Votre espace de travail</div><h1 id="title">Nouveau devis</h1></div><span class="pill">Version de démonstration</span></div><div id="view"></div></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n),cents=n=>Math.round((n+Number.EPSILON)*100)/100;
const initial={company:{name:'Atelier Martin',owner:'Alex Martin · EI',address:'12 rue des Artisans\n66000 Perpignan',id:'À renseigner',vat:''},clients:[{name:'Camille Dupont',address:'8 rue du Verger\n66000 Perpignan'}],catalog:[{name:'Pose de carrelage',unit:'m²',price:45,vat:20},{name:'Main-d’œuvre',unit:'h',price:56,vat:20},{name:'Fourniture de carrelage',unit:'m²',price:28,vat:20}],docs:[]};let db;try{db=JSON.parse(localStorage.getItem('gestio-demo-v1'))||structuredClone(initial)}catch{db=structuredClone(initial)}let current='editor',doc={type:'Devis',number:'DEV-001',date:'2026-10-16',client:0,template:'signature',mode:'global',rate:20,discount:5,advance:20,conditions:'20 % à la commande, solde à la fin des travaux.\nPaiements acceptés : virement, carte et chèque.',rows:[{name:'Pose de carrelage',qty:30,unit:'m²',price:45,vat:20},{name:'Fourniture de carrelage',qty:30,unit:'m²',price:28,vat:20}]};
function persist(){try{localStorage.setItem('gestio-demo-v1',JSON.stringify(db))}catch{toast('Stockage indisponible : exportez vos données.')}}function toast(s){document.querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),3500)}function field(label,id,val,type='text'){return `<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val)}"></div>`}function rates(val){return [0,5.5,10,20].map(n=>`<option value="${n}" ${+val===n?'selected':''}>${n} %</option>`).join('')}
function nav(page){current=page;$('nav').innerHTML=[['dash','Vue d’ensemble'],['editor','Créer un document'],['docs','Mes documents'],['clients','Clients'],['catalog','Catalogue'],['scan','Documents comptables'],['company','Mon entreprise']].map(([id,n])=>`<button class="${id===page?'active':''}" onclick="nav('${id}')">${n}</button>`).join('');$('title').textContent=({dash:'Votre activité en un regard',editor:'Créer un document',docs:'Mes documents',clients:'Vos clients',catalog:'Votre catalogue',scan:'Documents comptables',company:'Mon entreprise'})[page];if(page==='editor')editor();else if(page==='dash')dashboard();else if(page==='company')company();else if(page==='clients')clients();else if(page==='catalog')catalog();else if(page==='scan')scanView();else documents()}
function editor(){$('view').innerHTML=`<div class="grid"><div id="editor"><div class="card"><h2>01 · Votre document</h2><div class="fields"><div><label>Type de document</label><select id="dtype"><option ${doc.type==='Devis'?'selected':''}>Devis</option><option ${doc.type==='Facture'?'selected':''}>Facture</option></select></div>${field('Référence','number',doc.number)}${field('Date','date',doc.date,'date')}<div><label>Présentation</label><select id="template"><option value="signature">Signature · Violet</option><option value="minimal">Essentiel · Sobre</option><option value="atelier">Atelier · Bleu</option></select></div></div></div><div class="card"><h2>02 · Votre client</h2><select id="client">${db.clients.map((c,i)=>`<option value="${i}" ${doc.client===i?'selected':''}>${esc(c.name)}</option>`).join('')}</select><button class="tiny" style="margin-top:12px" onclick="nav('clients')">+ Ajouter ou modifier un client</button></div><div class="card"><div class="row" style="justify-content:space-between"><h2>03 · Prestations et matériaux</h2><span class="tag">Montants HT</span></div><div class="row"><select id="catpick"><option value="">Chercher dans le catalogue…</option>${db.catalog.map((c,i)=>`<option value="${i}">${esc(c.name)} · ${money(c.price)}/${esc(c.unit)}</option>`).join('')}</select><button onclick="addCatalog()">Ajouter</button></div><div id="rows"></div><button style="margin-top:15px" onclick="doc.rows.push({name:'',qty:1,unit:'u',price:0,vat:doc.rate});renderRows();preview()">+ Ligne libre</button><p class="helper">Un prix modifié ici reste propre à ce document. Le catalogue ne change pas.</p></div><div class="card"><h2>04 · Taxes et conditions</h2><div class="fields"><div><label>Mode de TVA</label><select id="mode"><option value="global">TVA globale</option><option value="line">TVA par ligne</option></select></div><div id="globalrate"><label>Taux global</label><select id="rate">${rates(doc.rate)}</select></div>${field('Remise globale (%)','discount',doc.discount,'number')}${field('Acompte demandé (%)','advance',doc.advance,'number')}</div><label style="margin-top:15px">Conditions de paiement</label><textarea id="conditions" rows="3">${esc(doc.conditions)}</textarea><p class="helper">Les taux doivent correspondre à l’opération. La remise est répartie entre les taux de TVA.</p></div><div class="actions"><button class="primary" onclick="saveDoc()">Enregistrer le brouillon</button><button onclick="window.print()">Imprimer / PDF</button></div><p class="helper">Prototype : enregistrement local, sans émission fiscale ni envoi au client.</p></div><div class="previewwrap"><div class="row previewbar" style="justify-content:space-between;margin:0 0 12px"><span class="muted">APERÇU DU DOCUMENT</span><span class="tag">Brouillon · A4</span></div><div id="paper" class="paper"></div></div></div>`;for(let id of ['template','mode'])$(id).value=doc[id];$('globalrate').hidden=doc.mode==='line';['number','date','discount','advance','conditions','rate','client','template'].forEach(id=>$(id).oninput=()=>{doc[id]=['discount','advance','rate','client'].includes(id)?Math.max(0,Math.min(['discount','advance'].includes(id)?100:999,+$(id).value||0)):$(id).value;preview()});$('dtype').onchange=()=>{doc.type=$('dtype').value;doc.number=(doc.type==='Devis'?'DEV':'FAC')+'-'+String(db.docs.filter(x=>x.type===doc.type).length+1).padStart(3,'0');$('number').value=doc.number;preview()};$('mode').onchange=()=>{if(doc.rows.length&&!confirm('Confirmer le changement de mode de TVA ? En mode global, le taux global remplace les taux des lignes dans le calcul. En mode par ligne, vérifiez chaque taux.')){$('mode').value=doc.mode;return}doc.mode=$('mode').value;$('globalrate').hidden=doc.mode==='line';renderRows();preview()};renderRows();preview()}
function renderRows(){$('rows').innerHTML=doc.rows.map((r,i)=>`<div class="line"><div class="row"><input aria-label="Désignation ligne ${i+1}" value="${esc(r.name)}" placeholder="Désignation de la prestation" oninput="editRow(${i},'name',this.value)"><button class="tiny" aria-label="Supprimer ligne ${i+1}" onclick="doc.rows.splice(${i},1);renderRows();preview()">×</button></div><div class="fields"><div><label>Quantité</label><input type="number" min="0" step="any" value="${r.qty}" oninput="editRow(${i},'qty',this.value)"></div><div><label>Unité</label><select onchange="editRow(${i},'unit',this.value)">${['u','h','m²','m','forfait'].map(u=>`<option ${u===r.unit?'selected':''}>${u}</option>`).join('')}</select></div><div><label>Prix unitaire HT</label><input type="number" min="0" step="0.01" value="${r.price}" oninput="editRow(${i},'price',this.value)"></div></div>${doc.mode==='line'?`<label style="margin-top:8px">TVA de cette ligne</label><select onchange="editRow(${i},'vat',this.value)">${rates(r.vat)}</select>`:''}<button class="tiny" style="margin-top:10px" onclick="saveArticle(${i})">Enregistrer dans le catalogue</button></div>`).join('')}
function editRow(i,k,v){doc.rows[i][k]=['qty','price','vat'].includes(k)?Math.max(0,+v||0):v;preview()}function addCatalog(){let c=db.catalog[$('catpick').value];if(!c)return;doc.rows.push({...c,qty:1});renderRows();preview()}function saveArticle(i){let r=doc.rows[i];if(!r.name.trim())return toast('Saisissez une désignation.');let found=db.catalog.find(c=>c.name.toLowerCase()===r.name.toLowerCase());if(found&&!confirm('Cet article existe. Mettre à jour son prix et son unité dans le catalogue ?'))return;let v={name:r.name,price:r.price,unit:r.unit,vat:r.vat};if(found)Object.assign(found,v);else db.catalog.push(v);persist();toast('Article enregistré dans le catalogue.')}
function calc(d=doc){let subtotal=cents(d.rows.reduce((s,r)=>s+cents(r.qty*r.price),0)),discount=cents(subtotal*d.discount/100),base=cents(subtotal-discount),groups={};for(let r of d.rows){let rate=d.mode==='global'?+d.rate:+r.vat;groups[rate]=(groups[rate]||0)+cents(r.qty*r.price)}let entries=Object.entries(groups).map(([rate,b],i,a)=>({rate:+rate,base:0,original:b}));let assigned=0;entries.forEach((g,i)=>{g.base=i===entries.length-1?cents(base-assigned):cents(subtotal?g.original/subtotal*base:0);assigned=cents(assigned+g.base);g.tax=cents(g.base*g.rate/100)});let tax=cents(entries.reduce((s,g)=>s+g.tax,0)),total=cents(base+tax);return{subtotal,discount,base,entries,tax,total,advance:cents(total*d.advance/100)}}
function preview(){let c=calc(),client=db.clients[doc.client]||{name:'Client à sélectionner',address:''},co=db.company,p=$('paper');p.className='paper '+doc.template;p.style.setProperty('--accent',doc.template==='atelier'?'#126a80':doc.template==='minimal'?'#293340':'#6553dc');p.innerHTML=`<div class="paperhead"><div><h3>${esc(co.name)}</h3><span class="muted">${esc(co.owner)}</span></div><div style="text-align:right"><h2>${doc.type.toUpperCase()}</h2>N° ${esc(doc.number)}<br>${esc(doc.date.split('-').reverse().join('/'))}<br><small>BROUILLON</small></div></div><div class="parties"><div><b>ÉMETTEUR</b>\n${esc(co.address)}\nSIRET : ${esc(co.id)}${co.vat?'\nTVA : '+esc(co.vat):''}</div><div><b>À L’ATTENTION DE</b>\n${esc(client.name)}\n${esc(client.address)}</div></div><table><thead><tr><th>Désignation</th><th>Qté</th><th>Unité</th><th>PU HT</th>${doc.mode==='line'?'<th>TVA</th>':''}<th>Total HT</th></tr></thead><tbody>${doc.rows.map(r=>`<tr><td>${esc(r.name)||'Prestation à préciser'}</td><td>${r.qty}</td><td>${esc(r.unit)}</td><td>${money(r.price)}</td>${doc.mode==='line'?`<td>${r.vat} %</td>`:''}<td>${money(cents(r.qty*r.price))}</td></tr>`).join('')}</tbody></table><div class="totals"><div class="sum"><span>Sous-total HT</span><b>${money(c.subtotal)}</b></div>${doc.discount?`<div class="sum"><span>Remise ${doc.discount} %</span><span>- ${money(c.discount)}</span></div>`:''}<div class="sum"><span>Net HT</span><b>${money(c.base)}</b></div>${c.entries.map(g=>`<div class="sum"><span>TVA ${g.rate} % sur ${money(g.base)}</span><span>${money(g.tax)}</span></div>`).join('')}<div class="sum grand"><span>Total TTC</span><b>${money(c.total)}</b></div></div><div><b>Conditions de paiement</b><p style="white-space:pre-line;line-height:1.7">${esc(doc.conditions)}</p>${doc.advance?`<p>Acompte ${doc.advance} % : <b>${money(c.advance)}</b><br>Solde : <b>${money(cents(c.total-c.advance))}</b></p>`:''}</div><div class="note">Document de démonstration · Données fictives<br>Les informations légales et fiscales doivent être complétées avant toute émission.</div>`}
function saveDoc(){if(!doc.rows.length||doc.rows.some(r=>!r.name.trim()))return toast('Ajoutez au moins une ligne et renseignez ses désignations.');let copy=structuredClone(doc);copy.id=doc.id||Date.now();copy.status='Brouillon';let i=db.docs.findIndex(x=>x.id===copy.id);if(i<0)db.docs.push(copy);else db.docs[i]=copy;doc.id=copy.id;persist();toast('Brouillon enregistré dans ce navigateur.')}
function dashboard(){let ds=db.docs,quotes=ds.filter(x=>x.type==='Devis').length,invoices=ds.filter(x=>x.type==='Facture').length;$('view').innerHTML=`<p class="muted">Tout ce qu’il faut pour avancer, sans ressaisie.</p><div class="stats">${[['Devis enregistrés',quotes],['Factures enregistrées',invoices],['Clients',db.clients.length]].map(([a,b])=>`<div class="card stat"><span class="muted">${a}</span><b>${b}</b><small>Dans votre espace de démonstration</small></div>`).join('')}</div><div class="card"><h2>Votre prochain document, en quelques minutes</h2><p>Choisissez un client, retrouvez vos prestations et vérifiez l’aperçu.</p><button class="primary" onclick="newDoc()">+ Créer un devis ou une facture</button></div><div class="card"><h2>Comment tester le prototype</h2><p>1. Modifiez vos coordonnées dans « Mon entreprise ».</p><p>2. Ajoutez vos clients et vos articles.</p><p>3. Essayez les deux modes de TVA et les trois présentations.</p><p>4. Enregistrez un brouillon puis imprimez-le en PDF.</p><p class="helper">Pas de compte serveur ni de synchronisation entre appareils dans cette maquette. Vous pouvez exporter vos données ci-dessous.</p><button onclick="exportData()">Exporter mes données</button></div>`}
function company(){let co=db.company;$('view').innerHTML=`<div class="card" style="max-width:740px"><h2>Vos coordonnées, enregistrées une seule fois</h2><div class="fields">${field('Nom commercial','cname',co.name)}${field('Titulaire / raison sociale','cowner',co.owner)}${field('SIRET','cid',co.id)}${field('N° TVA','cvat',co.vat)}</div><label style="margin-top:15px">Adresse complète</label><textarea id="caddress" rows="3">${esc(co.address)}</textarea><button class="primary" style="margin-top:20px" onclick="db.company={name:$('cname').value,owner:$('cowner').value,id:$('cid').value,vat:$('cvat').value,address:$('caddress').value};persist();toast('Coordonnées enregistrées.')">Enregistrer mes coordonnées</button></div>`}
function clients(){$('view').innerHTML=`<div class="grid"><div class="card"><h2>Ajouter un client</h2>${field('Nom ou entreprise','newclient','')}<label style="margin-top:15px">Adresse complète</label><textarea id="newaddress" rows="3"></textarea><button class="primary" style="margin-top:15px" onclick="if(!$('newclient').value.trim())return toast('Indiquez le nom du client.');db.clients.push({name:$('newclient').value,address:$('newaddress').value});persist();clients();toast('Client ajouté.')">Ajouter le client</button></div><div class="card"><h2>Clients enregistrés</h2>${db.clients.map((c,i)=>`<div class="listrow"><div><b>${esc(c.name)}</b><p class="muted" style="white-space:pre-line">${esc(c.address)}</p></div><button class="tiny" onclick="doc.client=${i};nav('editor')">Sélectionner</button></div>`).join('')}</div></div>`}
function catalog(){$('view').innerHTML=`<div class="grid"><div class="card"><h2>Nouvel article ou prestation</h2>${field('Désignation','aname','')}<div class="fields" style="margin-top:14px">${field('Unité (h, m², u…)','aunit','u')}${field('Prix unitaire HT','aprice',0,'number')}<div><label>TVA habituelle</label><select id="avat">${rates(20)}</select></div></div><button class="primary" style="margin-top:17px" onclick="if(!$('aname').value.trim())return toast('Indiquez la désignation.');db.catalog.push({name:$('aname').value,unit:$('aunit').value,price:Math.max(0,+$('aprice').value||0),vat:+$('avat').value});persist();catalog();toast('Article enregistré.')">Ajouter au catalogue</button></div><div class="card"><h2>Vos prestations et matériaux</h2><input placeholder="Rechercher un article…" aria-label="Rechercher un article" oninput="document.querySelectorAll('.article').forEach(e=>e.hidden=!e.textContent.toLowerCase().includes(this.value.toLowerCase()))">${db.catalog.map(c=>`<div class="listrow article"><div><b>${esc(c.name)}</b><p class="muted">${esc(c.unit)} · TVA ${c.vat} %</p></div><b>${money(c.price)} HT</b></div>`).join('')}</div></div>`}
function documents(){$('view').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2>Documents enregistrés</h2><button class="primary" onclick="newDoc()">+ Nouveau</button></div>${db.docs.length?db.docs.map((d,i)=>`<div class="listrow"><div><b>${esc(d.number)}</b> · ${esc(d.type)}<p class="muted">${esc(db.clients[d.client]?.name||'Client')} · ${money(calc(d).total)} TTC</p><span class="tag">${esc(d.status)}</span></div><div class="actions"><button class="tiny" onclick="doc=structuredClone(db.docs[${i}]);nav('editor')">Ouvrir</button>${d.type==='Devis'?`<button class="tiny" onclick="convert(${i})">Accepter et créer une facture</button>`:''}</div></div>`).join(''):'<p class="muted">Votre premier document apparaîtra ici après enregistrement.</p>'}</div>`}
function convert(i){let q=db.docs[i];q.status='Accepté';doc=structuredClone(q);delete doc.id;doc.type='Facture';doc.number='FAC-'+String(db.docs.filter(x=>x.type==='Facture').length+1).padStart(3,'0');doc.status='Brouillon';persist();nav('editor');toast('Facture préparée depuis le devis. Vérifiez puis enregistrez.')}
function newDoc(){delete doc.id;doc.type='Devis';doc.number='DEV-'+String(db.docs.filter(x=>x.type==='Devis').length+1).padStart(3,'0');doc.rows=[{name:'',qty:1,unit:'u',price:0,vat:20}];nav('editor')}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='gestio-donnees.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}nav('editor');
</script><script src="scanner.js?v=document-white-3"></script></html>
